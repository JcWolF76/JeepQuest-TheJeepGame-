name: Deploy to GitHub Pages

# Why this workflow exists (see CLAUDE.md section 1):
# Pages' legacy "deploy from a branch" mode rebuilds on push — but pushes
# made with a GitHub App token (how Claude Code on the web pushes) do NOT
# trigger those builds. That silently froze the live site at one commit
# while six later commits sat on GitHub undeployed. Building through
# Actions instead means every push deploys, whoever pushed it.

on:
  push:
    # Triggered on both branches, which are kept in sync. The job below
    # then deploys only from whichever one is currently the repo default,
    # so this needs no edit when the default changes to main.
    branches:
      - main
      - claude/jeepquest-game-dev-k8i6ss
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # The github-pages environment admits only the repo's default branch;
    # any other branch is rejected by its protection rule *after* a
    # deployment record is created, leaving a failed deployment behind on
    # every push. Skipping cleanly here instead means no failures, and the
    # deploying branch follows the default automatically if it is changed.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          # The site is the repo root — plain static HTML/CSS/JS, no build step.
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
