<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" role="img" aria-labelledby="jqTitle">
  <title id="jqTitle">JeepQuest - The Jeep Game</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="titleFill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5dade2"/>
      <stop offset="100%" stop-color="#3498db"/>
    </linearGradient>
    <linearGradient id="rigBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8791f"/>
      <stop offset="100%" stop-color="#c0601a"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="632" height="212" rx="24" fill="url(#bg)" stroke="#3498db" stroke-opacity="0.35" stroke-width="2"/>

  <!-- simple boxy off-road rig silhouette (placeholder art) -->
  <g transform="translate(60,118)">
    <rect x="0" y="-10" width="150" height="46" rx="8" fill="url(#rigBody)"/>
    <rect x="14" y="-38" width="96" height="34" rx="6" fill="url(#rigBody)"/>
    <rect x="22" y="-32" width="34" height="22" rx="3" fill="#dff1fb" opacity="0.85"/>
    <rect x="62" y="-32" width="34" height="22" rx="3" fill="#dff1fb" opacity="0.85"/>
    <circle cx="26" cy="38" r="20" fill="#1a1a1a" stroke="#7f8c8d" stroke-width="3"/>
    <circle cx="124" cy="38" r="20" fill="#1a1a1a" stroke="#7f8c8d" stroke-width="3"/>
    <circle cx="26" cy="38" r="7" fill="#7f8c8d"/>
    <circle cx="124" cy="38" r="7" fill="#7f8c8d"/>
  </g>

  <text x="320" y="108" text-anchor="middle" font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif" font-size="54" font-weight="800" letter-spacing="2" fill="url(#titleFill)">JEEPQUEST</text>
  <text x="320" y="140" text-anchor="middle" font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#ecf0f1" opacity="0.85">THE JEEP GAME</text>
  <text x="320" y="176" text-anchor="middle" font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif" font-size="13" letter-spacing="1" fill="#bdc3c7" opacity="0.8">PLACEHOLDER LOGO — swap this file for final art</text>
</svg>
